[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mls-khajiit"
version = "0.1.0"
description = "MLS-Khajiit: unified MLSA/MLST phylogenetic pipeline — BLAST extraction, alignment, supermatrix, RAxML tree (MinVar or outgroup rooting), and tseemann/mlst typing"
authors = [
    { name = "Paul", email = "paul.j.worden@gmail.com" }
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "biopython"
]

[project.scripts]
mls-khajiit = "mls_khajiit.mls_khajiit:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
